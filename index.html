<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PKG 图片提取器 · Wallpaper Engine</title>
<style>
  :root{
    --bg:#0c0a12;
    --bg2:#14101f;
    --card:#1a1526;
    --line:rgba(255,255,255,.08);
    --text:#f2eefb;
    --muted:#a79fbd;
    --accent:#b98cff;
    --accent2:#7c5cff;
    --ok:#6ee7b7;
    --danger:#ff7a90;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(124,92,255,.35), transparent 60%),
      radial-gradient(900px 600px at 92% 0%, rgba(255,120,200,.18), transparent 55%),
      radial-gradient(1000px 800px at 50% 120%, rgba(80,200,255,.10), transparent 60%),
      var(--bg);
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px}

  header{text-align:center;margin-bottom:26px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);
    border:1px solid rgba(185,140,255,.35);
    background:rgba(185,140,255,.08);
    padding:6px 14px;border-radius:999px;
  }
  h1{
    margin:16px 0 10px;font-size:clamp(26px,4vw,40px);line-height:1.15;
    background:linear-gradient(100deg,#fff 10%,#d9c6ff 50%,#ff9fd0 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:-.01em;
  }
  header p{margin:0;color:var(--muted);font-size:15px}
  header p code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;font-size:13px}

  /* ---------- drop zone ---------- */
  .drop{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;cursor:pointer;user-select:none;
    border:2px dashed rgba(185,140,255,.35);
    border-radius:var(--radius);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    padding:56px 24px;transition:.22s ease;
    backdrop-filter:blur(6px);
  }
  .drop:hover{border-color:rgba(185,140,255,.7);background:rgba(185,140,255,.08);transform:translateY(-1px)}
  .drop.drag{border-color:var(--accent);background:rgba(185,140,255,.14);box-shadow:0 0 0 6px rgba(185,140,255,.08) inset}
  .drop .icon{
    width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(185,140,255,.28),rgba(124,92,255,.12));
    border:1px solid rgba(185,140,255,.35);
    color:#e7d9ff;
  }
  .drop .icon svg{width:30px;height:30px}
  .drop h2{margin:0;font-size:18px;font-weight:650}
  .drop p{margin:0;color:var(--muted);font-size:13.5px}
  .drop input{display:none}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    margin:26px 0 18px;padding:14px 18px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;
  }
  .toolbar .stat{font-size:13.5px;color:var(--muted)}
  .toolbar .stat b{color:var(--text);font-weight:650}
  .toolbar .spacer{flex:1}
  .btn{
    appearance:none;border:1px solid var(--line);border-radius:11px;
    background:rgba(255,255,255,.06);color:var(--text);
    font:inherit;font-size:13.5px;font-weight:600;
    padding:9px 16px;cursor:pointer;transition:.18s ease;
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  }
  .btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent2),#c084fc);
    border-color:transparent;color:#fff;
    box-shadow:0 8px 24px -10px rgba(124,92,255,.9);
  }
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn svg{width:16px;height:16px}

  /* ---------- gallery ---------- */
  .gallery{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .card{
    margin:0;border-radius:16px;overflow:hidden;position:relative;
    background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;
    transition:.2s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(185,140,255,.45);box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
  .thumb{
    position:relative;display:block;cursor:zoom-in;background:
      linear-gradient(45deg,#221c33 25%,transparent 25%) 0 0/22px 22px,
      linear-gradient(-45deg,#221c33 25%,transparent 25%) 0 11px/22px 22px,
      linear-gradient(45deg,transparent 75%,#221c33 75%) 11px -11px/22px 22px,
      linear-gradient(-45deg,transparent 75%,#221c33 75%) -11px 0/22px 22px;
    background-color:#191328;
    aspect-ratio:3/4;max-height:460px;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
  .name{
    font-size:13px;font-weight:650;line-height:1.35;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    word-break:break-all;
  }
  .meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .pill{background:rgba(255,255,255,.07);border-radius:999px;padding:2px 9px}
  .pill.hot{color:#ffd7a8;background:rgba(255,180,90,.12)}

  /* ---------- entries ---------- */
  details{
    margin-top:24px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.03);padding:2px 4px;
  }
  summary{
    cursor:pointer;padding:12px 14px;font-size:13.5px;color:var(--muted);
    list-style:none;display:flex;align-items:center;gap:8px
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--accent);transition:.2s}
  details[open] summary::before{transform:rotate(90deg)}
  .entries{padding:0 14px 12px;font-size:12.5px}
  .pkghead{color:var(--accent);font-weight:650;margin:10px 0 6px;font-size:12.5px}
  .entry{
    display:grid;grid-template-columns:1fr auto auto;gap:12px;
    padding:6px 8px;border-radius:8px;color:var(--muted);
    font-family:ui-monospace,Consolas,monospace;
  }
  .entry:nth-child(odd){background:rgba(255,255,255,.025)}
  .entry .nm{color:#d8d0ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .tag{font-size:11px;color:var(--accent)}
  .entry .sz{text-align:right}

  /* ---------- misc ---------- */
  .empty{margin:8px 0 0;color:var(--muted);font-size:13px;text-align:center}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#241b38;border:1px solid rgba(185,140,255,.45);
    color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;
    box-shadow:0 20px 50px -20px #000;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,122,144,.5);background:#2a1520}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  .hint b{color:#cfc3ea;font-weight:600}

  /* lightbox */
  .lightbox{
    position:fixed;inset:0;background:rgba(6,4,10,.92);display:none;
    align-items:center;justify-content:center;z-index:60;padding:24px;
    backdrop-filter:blur(4px);
  }
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px -20px #000}
  .lightbox .close{
    position:absolute;top:18px;right:22px;font-size:26px;color:#fff;
    background:rgba(255,255,255,.1);border:0;border-radius:50%;
    width:42px;height:42px;cursor:pointer;line-height:1
  }
  .hidden{display:none !important}

  @media (max-width:640px){
    .wrap{padding:26px 16px 60px}
    .drop{padding:38px 18px}
    .gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .toolbar{padding:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">Wallpaper Engine · PKGV</span>
    <h1>PKG 图片提取器</h1>
    <p>把 <code>scene.pkg</code> 丢进来，直接解析出里面的图片并下载。全程本地运行，不联网、不上传。</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" multiple accept=".pkg,application/octet-stream">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
    </span>
    <h2>拖拽 pkg 到这里，或点击选择</h2>
    <p>支持多个文件 · 一般位于 <code>steamapps\workshop\content\431960\&lt;id&gt;\scene.pkg</code></p>
  </label>

  <section id="result" class="hidden">
    <div class="toolbar">
      <span class="stat" id="stat"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="zip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        打包下载全部
      </button>
      <button class="btn" id="reset">清空</button>
    </div>
    <div class="gallery" id="gallery"></div>
    <p class="empty hidden" id="noimg">没有在包里找到可解析的图片（PNG / JPG）。</p>

    <details id="entriesBox">
      <summary>包内全部文件 <span id="entryCount"></span></summary>
      <div class="entries" id="entryList"></div>
    </details>
  </section>

  <p class="hint">解析逻辑：读取 <b>PKGV</b> 条目表 → 定位 <b>.tex</b> 贴图 → 提取 <b>TEXV/TEXB</b> 容器内嵌的 <b>PNG / JPG</b> 图像（含各级 mipmap）。<br>若某个贴图是旧式 DXT/BC 压缩数据，会标注“暂不支持”而不会被误导出。</p>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><button class="close" id="lbClose">×</button><img id="lbImg" alt=""></div>

<script src="app.js"></script>
</body>
</html>
